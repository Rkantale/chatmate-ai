<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatmate AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; display: flex; justify-content: center; min-height: 100vh; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    textarea:focus, input:focus { outline: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const SYSTEM_PROMPT = "You are a helpful WhatsApp AI assistant. Keep responses short and conversational like real WhatsApp messages. Use emojis naturally.";

function formatTime(d) {
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function App() {
  const [screen, setScreen] = useState("key"); // key | chat
  const [apiKey, setApiKey] = useState("");
  const [keyInput, setKeyInput] = useState("");
  const [error, setError] = useState("");
  const [messages, setMessages] = useState([
    { id: 1, role: "assistant", text: "Hey! 👋 I'm your AI assistant. How can I help you today?", time: new Date() }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, loading]);

  function submitKey() {
    const k = keyInput.trim();
    if (!k.startsWith("sk-ant-")) {
      setError("❌ Key must start with sk-ant-");
      return;
    }
    setApiKey(k);
    setScreen("chat");
  }

  async function sendMessage() {
    const text = input.trim();
    if (!text || loading) return;
    setInput("");
    const userMsg = { id: Date.now(), role: "user", text, time: new Date() };
    setMessages(prev => [...prev, userMsg]);
    setLoading(true);
    try {
      const history = [...messages, userMsg].map(m => ({ role: m.role, content: m.text }));
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 500,
          system: SYSTEM_PROMPT,
          messages: history,
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const reply = data.content?.map(c => c.text || "").join("") || "No response 😕";
      setMessages(prev => [...prev, { id: Date.now()+1, role: "assistant", text: reply, time: new Date() }]);
    } catch (err) {
      setMessages(prev => [...prev, { id: Date.now()+1, role: "assistant", text: "Error: " + err.message, time: new Date() }]);
    } finally {
      setLoading(false);
    }
  }

  if (screen === "key") return (
    <div style={{ minHeight:"100vh", width:"100%", background:"#075E54", display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div style={{ background:"white", borderRadius:20, padding:30, width:"100%", maxWidth:360, textAlign:"center" }}>
        <div style={{ fontSize:50, marginBottom:10 }}>🔑</div>
        <h2 style={{ color:"#075E54", marginBottom:8 }}>Enter Anthropic API Key</h2>
        <p style={{ color:"#555", fontSize:13, marginBottom:6 }}>Get free key from:</p>
        <p style={{ color:"#075E54", fontWeight:700, fontSize:14, marginBottom:20 }}>console.anthropic.com → API Keys</p>
        {error && <p style={{ color:"red", fontSize:13, marginBottom:10 }}>{error}</p>}
        <input
          style={{ width:"100%", padding:"12px 16px", borderRadius:12, border:"1.5px solid #ddd", fontSize:13, marginBottom:12, fontFamily:"monospace" }}
          type="text"
          placeholder="sk-ant-api03-..."
          value={keyInput}
          onChange={e => { setKeyInput(e.target.value); setError(""); }}
          onKeyDown={e => e.key === "Enter" && submitKey()}
        />
        <button
          onClick={submitKey}
          style={{ width:"100%", padding:14, borderRadius:12, background:"#25D366", color:"white", fontWeight:700, fontSize:16, border:"none", cursor:"pointer" }}
        >
          Start Chatting ➤
        </button>
        <p style={{ marginTop:16, fontSize:12, color:"#999" }}>Your key is never stored or shared</p>
      </div>
    </div>
  );

  return (
    <div style={{ maxWidth:390, width:"100%", height:"100vh", display:"flex", flexDirection:"column", background:"#ECE5DD", fontFamily:"'Segoe UI', sans-serif", overflow:"hidden" }}>
      {/* Status */}
      <div style={{ background:"#075E54", color:"white", fontSize:12, padding:"4px 16px", display:"flex", justifyContent:"space-between" }}>
        <span>{formatTime(new Date())}</span><span>📶 🔋</span>
      </div>
      {/* Header */}
      <div style={{ background:"#075E54", padding:"8px 12px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <span style={{ color:"white", fontSize:28 }}>‹</span>
          <div style={{ width:38, height:38, borderRadius:"50%", background:"#25D366", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22 }}>🤖</div>
          <div>
            <div style={{ color:"white", fontWeight:600, fontSize:15 }}>AI Assistant</div>
            <div style={{ color:"#B2DFDB", fontSize:12 }}>online</div>
          </div>
        </div>
        <div style={{ display:"flex", gap:16 }}>
          <span style={{ fontSize:18, opacity:0.9 }}>📹</span>
          <span style={{ fontSize:18, opacity:0.9 }}>📞</span>
          <span style={{ color:"white", fontSize:20, cursor:"pointer" }} onClick={() => setScreen("key")}>⚙️</span>
        </div>
      </div>
      {/* Messages */}
      <div style={{ flex:1, overflowY:"auto", padding:"12px 10px" }}>
        <div style={{ textAlign:"center", fontSize:11, color:"#666", background:"rgba(255,255,255,0.7)", borderRadius:10, padding:"3px 12px", display:"inline-block", width:"100%", marginBottom:12 }}>TODAY</div>
        {messages.map(msg => (
          <div key={msg.id} style={{ display:"flex", justifyContent: msg.role==="user"?"flex-end":"flex-start", alignItems:"flex-end", gap:6, marginBottom:6 }}>
            {msg.role==="assistant" && (
              <div style={{ width:28, height:28, borderRadius:"50%", background:"#25D366", display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, flexShrink:0 }}>🤖</div>
            )}
            <div style={{ background: msg.role==="user"?"#DCF8C6":"white", borderRadius: msg.role==="user"?"10px 0 10px 10px":"0 10px 10px 10px", padding:"8px 10px 5px", maxWidth:"78%", boxShadow:"0 1px 1px rgba(0,0,0,0.1)" }}>
              <p style={{ fontSize:14, color:"#303030", lineHeight:1.45, whiteSpace:"pre-wrap", wordBreak:"break-word" }}>{msg.text}</p>
              <div style={{ display:"flex", justifyContent:"flex-end", gap:3, marginTop:3 }}>
                <span style={{ fontSize:11, color:"#8C8C8C" }}>{formatTime(msg.time)}</span>
                {msg.role==="user" && <span style={{ fontSize:12, color:"#4FC3F7" }}>✓✓</span>}
              </div>
            </div>
          </div>
        ))}
        {loading && (
          <div style={{ display:"flex", alignItems:"flex-end", gap:6, marginBottom:6 }}>
            <div style={{ width:28, height:28, borderRadius:"50%", background:"#25D366", display:"flex", alignItems:"center", justifyContent:"center", fontSize:16 }}>🤖</div>
            <div style={{ background:"white", borderRadius:"0 10px 10px 10px", padding:"12px 14px", display:"flex", gap:4 }}>
              {[0,0.2,0.4].map((d,i) => <span key={i} style={{ width:7, height:7, borderRadius:"50%", background:"#999", display:"inline-block", animation:`bounce 1.2s ${d}s infinite` }} />)}
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>
      {/* Input */}
      <div style={{ background:"#F0F0F0", padding:"8px", display:"flex", alignItems:"center", gap:6, borderTop:"1px solid #ddd" }}>
        <span style={{ fontSize:22 }}>😊</span>
        <textarea
          ref={inputRef}
          style={{ flex:1, background:"white", border:"none", borderRadius:20, padding:"9px 14px", fontSize:14, resize:"none", maxHeight:80, lineHeight:1.4, fontFamily:"inherit", color:"#303030" }}
          placeholder="Message"
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }}}
          rows={1}
        />
        <span style={{ fontSize:20 }}>📎</span>
        <button
          onClick={sendMessage}
          disabled={loading}
          style={{ width:40, height:40, borderRadius:"50%", background:"#25D366", border:"none", color:"white", fontSize:18, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}
        >
          {input.trim() ? "➤" : "🎤"}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
